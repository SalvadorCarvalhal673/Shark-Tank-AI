name: Checks
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Full audit — SE-001 remains open; review all findings
        run: npm audit
      - name: Production-only audit — does not clear vendored code
        run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - name: Original 82 browser scenarios
        run: npm run test:e2e -- --workers=2
      - name: Prototype 12 scenarios — software WebGL, not phone certification
        run: npx playwright test --config playwright.ci.config.ts
